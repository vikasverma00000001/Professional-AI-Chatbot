<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Professional AI Chatbot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <!-- Header -->

        <div class="header">

            <h1> Professional AI Chatbot</h1>

            <p>Powered by Gemini API + Flask</p>

        </div>


        <!-- Chat Area -->

        <div id="chat-box" class="chat-box">

            <div class="message bot">

                Hello

                <br><br>

                I am your AI Assistant.

                <br><br>

                Ask me anything.

            </div>

        </div>


        <!-- Input Area -->

        <div class="input-area">

            <input

                type="text"

                id="user-input"

                placeholder="Type your question here..."

                autocomplete="off"

            >

            <button

                id="send-btn">

                Send

            </button>

        </div>

    </div>

    <script

        src="{{ url_for('static', filename='script.js') }}">

    </script>

</body>

</html>
